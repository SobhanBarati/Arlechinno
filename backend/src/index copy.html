<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Socket Test</title>
</head>

<body>

    <button id="join">
        Join Chat
    </button>

    <button id="send">
        Send Message
    </button>

    <button id="typing">
        Typing Start
    </button>

    <button id="stopTyping">
        Typing Stop
    </button>

    <button id="seen">
        Open Chat
    </button>

    <button id="edit">
        Edit Message
    </button>

    <script type="module">

        import { io }
            from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";

        const ACCESS_TOKEN =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YTJhMmVhY2QyNTAwOTNkMTE4NmY5N2MiLCJpYXQiOjE3ODUyNTE4MDgsImV4cCI6MTc4NTI1MjcwOH0.o72Bh6naaOoDg_S55w3V3RTLrDqJaj137Ti3ETcMnWM";

        const chatId =
            "6a2a9c64e54d38220eb988f6";

        const socket =
            io(
                "http://localhost:5000",
                {
                    auth: {
                        token: ACCESS_TOKEN
                    }
                }
            );

        socket.on(
            "connect",
            () => {

                console.log(
                    "Connected:",
                    socket.id
                );

            }
        );

        socket.on(
            "connect_error",
            (err) => {

                console.log(
                    "Connect Error:",
                    err.message
                );

            }
        );

        socket.on(
            "disconnect",
            (reason) => {

                console.log(
                    "Disconnected:",
                    reason
                );

            }
        );

        socket.on(
            "receive_message",
            (message) => {

                console.log(
                    "New Message:",
                    message
                );

            }
        );

        socket.on(
            "error_message",
            (message) => {

                console.log(
                    "Socket Error:",
                    message
                );

            }
        );

        socket.on(
            "user_typing",
            (data) => {

                console.log(
                    "Typing:",
                    data.userId
                );

            }
        );

        socket.on(
            "user_stop_typing",
            (data) => {

                console.log(
                    "Stop Typing:",
                    data.userId
                );

            }
        );

        socket.on(
            "messages_seen",
            (data) => {

                console.log(
                    "MESSAGES SEEN:",
                    data
                );

            }
        );

        socket.on(
            "user_online",
            (data) => {
            
                console.log(
                    "ONLINE:",
                    data.userId
                );
            
            }
        );
        
        socket.on(
            "user_offline",
            (data) => {
            
                console.log(
                    "OFFLINE:",
                    data.userId
                );
            
            }
        );
        
        socket.on(
            "message_edited",
            (message) => {
            
                console.log(
                    "MESSAGE EDITED:",
                    message
                );
            
            }
        );

        document
            .getElementById("join")
            .addEventListener(
                "click",
                () => {

                    socket.emit(
                        "join_chat",
                        chatId
                    );

                }
            );

        document
            .getElementById("send")
            .addEventListener(
                "click",
                () => {

                    socket.emit(
                        "send_message",
                        {
                            chatId,
                            content:
                                "سلام از سوکت"
                        }
                    );

                }
            );

        document
            .getElementById("typing")
            .addEventListener(
                "click",
                () => {

                    socket.emit(
                        "typing_start",
                        {
                            chatId
                        }
                    );

                }
            );

        document
            .getElementById("stopTyping")
            .addEventListener(
                "click",
                () => {

                    socket.emit(
                        "typing_stop",
                        {
                            chatId
                        }
                    );

                }
            );

        document
            .getElementById("seen")
            .addEventListener(
                "click",
                () => {

                    socket.emit(
                        "messages_seen",
                        {
                            chatId
                        }
                    );

                }
            );

        document
            .getElementById("edit")
            .addEventListener(
                "click",
                () => {
                
                    socket.emit(
                        "edit_message",
                        {
                        
                            messageId:
                                "6a2aa6cc130228907b3fa1da",
                        
                            content:
                                "پیام ویرایش شد با سوکت"
                        
                        }
                    );
                    
                }
            );

    </script>

</body>

</html>
