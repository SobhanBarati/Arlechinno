<!DOCTYPE html>
<html>
<head>
  <title>Socket Test</title>
</head>
<body>

<button id="join">Join Chat</button>
<button id="send">Send Message</button>

<script type="module">
import { io } from "https://cdn.socket.io/4.8.1/socket.io.esm.min.js";

const ACCESS_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2YTI1YzIyZjQ2NTE1Y2I5MzRjMTAxYzkiLCJpYXQiOjE3ODE4MTIyMDcsImV4cCI6MTc4MTgxMzEwN30.KTK1w-BocRzlSUK3evbdkrT-QhAR1ZnmIfLRKmf6LPI";


const socket =
  io("http://localhost:5000", {
    auth: {
      token: ACCESS_TOKEN
    }
  });

const chatId = "6a2a9c64e54d38220eb988f6";
//const senderId = "6a2a2eacd250093d1186f97c";

socket.on("connect", () => {
  console.log("Connected:", socket.id);
});

socket.on("connect_error", (err) => {
  console.log("Connect Error:", err.message);
});

socket.on("disconnect", (reason) => {
  console.log("Disconnected:", reason);
});

socket.on("receive_message", (message) => {
  console.log("New Message:", message);
});

document
  .getElementById("join")
  .addEventListener("click", () => {
    socket.emit("join_chat", chatId);
  });

document
  .getElementById("send")
  .addEventListener("click", () => {
    socket.emit("send_message", {
      chatId,
      content: "سلام سوکت"
    });
  });
</script>

</body>
</html>
